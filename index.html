<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardín de Atardecer - Girasoles, Rosas y Tulipanes</title>
    <meta name="description" content="Una experiencia poética interactiva con animación de girasoles, rosas, tulipanes al atardecer y una carta especial.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Fondo de Atardecer Dynamic Canvas -->
    <canvas id="sunsetCanvas"></canvas>

    <!-- Capa de Sol y Rayos de Atardecer -->
    <div class="sunset-sun-container">
        <div class="sun"></div>
        <div class="sun-glow"></div>
        <div class="horizon-glow"></div>
    </div>

    <!-- Contenedor Principal de la Experiencia -->
    <main class="app-container">
        
        <!-- Indicador Superior de Etapas de Flores -->
        <header class="stage-header">
            <div class="badge-stage" id="stageBadge">
                <span class="flower-icon" id="stageIcon">🌻</span>
                <span class="stage-text" id="stageText">Girasoles radiantes como tu</span>
            </div>
            <div class="stage-progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </header>

        <!-- Escenario de Flores (Lienzo Interactivo de Crecimiento y Floración) -->
        <section class="flower-stage">
            <canvas id="flowerCanvas"></canvas>
        </section>

        <!-- Sobre Interactivo (Aparece al terminar la secuencia de tulipanes) -->
        <section class="envelope-container hidden" id="envelopeContainer">
            <div class="envelope-wrapper" id="envelopeWrapper" title="¡Haz clic para abrir tu carta!">
                <div class="envelope">
                    <!-- Solapa Trasera -->
                    <div class="back-flap"></div>
                    
                    <!-- Carta interior parcialmente visible -->
                    <div class="letter-preview">
                        <div class="preview-line"></div>
                        <div class="preview-line short"></div>
                        <div class="preview-line"></div>
                    </div>
                    
                    <!-- Solapa Frontal (Lados) -->
                    <div class="pocket"></div>
                    
                    <!-- Solapa Superior que se abre -->
                    <div class="top-flap" id="topFlap"></div>

                    <!-- Sello de Cera Dorado / Rojo -->
                    <div class="wax-seal" id="waxSeal">
                        <span class="seal-icon">❤️</span>
                    </div>
                </div>

                <div class="envelope-hint">
                    <span class="sparkle-left">✨</span>
                    <span class="hint-text">Toca el sobre para abrir la carta</span>
                    <span class="sparkle-right">✨</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal de la Carta Desplegada -->
    <div class="letter-modal hidden" id="letterModal">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        
        <div class="letter-paper">
            <!-- Botón de Cierre -->
            <button class="close-letter-btn" id="closeLetterBtn" aria-label="Cerrar carta">&times;</button>
            
            <!-- Decoraciones de Esquina de la Carta -->
            <div class="corner-decor top-left">🌻</div>
            <div class="corner-decor top-right">🌹</div>
            <div class="corner-decor bottom-left">🌷</div>
            <div class="corner-decor bottom-right">✨</div>

            <!-- Contenido de la Carta -->
            <div class="letter-content">
                <div class="letter-header">
                    <span class="letter-date" id="letterDate">Hoy y para siempre</span>
                    <h2 class="letter-recipient" id="letterRecipient">Para alguien especial</h2>
                    <div class="letter-divider">
                        <span>❖</span><span>❖</span><span>❖</span>
                    </div>
                </div>

                <h3 class="letter-title" id="letterTitle">Un detalle de mi corazón</h3>

                <div class="letter-body" id="letterBody">
                    <!-- El mensaje se inserta dinámicamente desde config.js -->
                </div>

                <div class="letter-footer">
                    <p class="letter-signature-text" id="letterSignature">Con todo mi cariño,</p>
                    <p class="letter-sender-name" id="letterSender">Tu persona especial ❤️</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Único Botón Flotante Inferior: Control de Música -->
    <footer class="controls-bar">
        <button class="control-btn music-btn" id="musicToggleBtn" title="Reproducir / Pausar Música">
            <span class="btn-icon" id="musicIcon">🎵</span>
            <span class="btn-text" id="musicText">Reproduce la cancion Val</span>
        </button>
    </footer>

    <!-- Audio Element -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- Archivos JavaScript -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
